services:
  - type: web
    name: case-cxsuite-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AllowedOrigins
        sync: false
      # Apply EF migrations automatically on start (idempotent; takes a database advisory lock).
      # For stricter deployments set this to "false" and run
      #   dotnet CaseManagement.Api.dll --migrate-only
      # as a separate release step instead.
      - key: Database__MigrateOnStartup
        value: "true"
      # Which seed data to create on a NEW database: None | Bootstrap | Development.
      # "Development" (sample users/teams/customers) is kept ONLY because the Host App does not
      # exist yet and the standalone demo needs users. Switch to "Bootstrap" once the Host supplies
      # users. Existing databases are never re-seeded either way.
      - key: Database__Seed
        value: "Development"
      # No Host App exists yet, so this deployment runs in Standalone mode, which has NO real
      # authentication (callers name themselves with a header). It is refused in production unless
      # allowed explicitly, as here. When the Host is ready: set HostIntegration__Mode=Host, remove
      # AllowStandaloneInProduction and configure HostIntegration__Jwt__* (see HOST_INTEGRATION.md).
      - key: HostIntegration__Mode
        value: Standalone
      - key: HostIntegration__AllowStandaloneInProduction
        value: "true"
      - key: AllowedHosts
        sync: false
      - key: EnableSwagger
        value: "false"
