services:
  - type: web
    name: case-cxsuite-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AllowedOrigins
        sync: false
      # Apply EF migrations automatically on start (idempotent; takes a database advisory lock).
      # For stricter deployments set this to "false" and run
      #   dotnet CaseManagement.Api.dll --migrate-only
      # as a separate release step instead.
      - key: Database__MigrateOnStartup
        value: "true"
      # Which seed data to create on a NEW database: None | Bootstrap | Development.
      # "Development" (sample users/teams/customers) is kept ONLY because the Host App does not
      # exist yet and the standalone demo needs users. Switch to "Bootstrap" once the Host supplies
      # users. Existing databases are never re-seeded either way.
      - key: Database__Seed
        value: "Development"
      # Hybrid: one backend for both the Host App and the standalone site. Both send OmniConnect AuthService
      # tokens (the standalone site signs people in with their OmniConnect account). See HOST_INTEGRATION.md §5.
      # Set HostIntegration__Jwt__PublicKeyPem in the dashboard BEFORE deploying: without a key the service refuses to start.
      - key: HostIntegration__Mode
        value: Hybrid
      - key: HostIntegration__Jwt__PublicKeyPem
        sync: false
      - key: HostIntegration__Jwt__Issuer
        value: omniconnect-auth-service
      - key: HostIntegration__Jwt__Audience
        value: omniconnect-host
      - key: HostIntegration__Claims__Permissions
        value: perms
      - key: HostIntegration__Claims__Administrator
        value: administrator
      # Demo user picker on the standalone site (callers WITHOUT a token name themselves with a header: no real
      # authentication). Remove both lines to allow OmniConnect sign-in only.
      - key: HostIntegration__HybridAllowsDevHeader
        value: "true"
      - key: HostIntegration__AllowStandaloneInProduction
        value: "true"
      - key: AllowedHosts
        sync: false
      - key: EnableSwagger
        value: "false"
